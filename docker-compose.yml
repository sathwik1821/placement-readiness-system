services:
  postgres:
    image: postgres:16-alpine
    container_name: ascend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: placementdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d placementdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
