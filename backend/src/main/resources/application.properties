server.port=5000

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/placementdb?options=-c%20timezone=Asia/Kolkata
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Security JWT Secret
jwt.secret=placement_readiness_spring_boot_secret_key_2024_secure_and_reliable_token

# Google Gemini LLM API Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-1.5-flash}

# Email (SMTP) Configuration for RGUKT Verification OTP & Centralized Notifications
# Gmail App Password: generate at https://myaccount.google.com/apppasswords
# Set MAIL_USERNAME and MAIL_PASSWORD as environment variables, or fill below for local dev
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:sathwikbodakunta2005@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Flyway Database Versioned Schema Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Ascend Application Links & Centralized Notification Config
app.base-url=${APP_BASE_URL:http://localhost:5173}
app.api-url=${APP_API_URL:http://localhost:5000/api}
app.admin-email=${ADMIN_EMAIL:admin@system.com}
app.notifications.email-enabled=${EMAIL_NOTIFICATIONS_ENABLED:true}
